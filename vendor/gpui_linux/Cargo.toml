[package]
name = "gpui_ce_linux"
version = "0.1.0"
description = "GPUI CE's Linux platform, with drawing tablet support (vendored by kadr)"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
  "bitflags",
  "gpui_wgpu",
  "ashpd/wayland",

  "calloop-wayland-source",
  "memfd",
  "wayland-backend",
  "wayland-client",
  "wayland-cursor",
  "wayland-protocols",
  "wayland-protocols-plasma",
  "wayland-protocols-wlr",
  "filedescriptor",
  "xkbcommon/wayland",
  "open",
  "gpui/wayland",
]
x11 = [
  "gpui_wgpu",
  "ashpd",

  "as-raw-xcb-connection",
  "x11rb",
  "xkbcommon/x11",
  "xim",
  "x11-clipboard",
  "filedescriptor",
  "open",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = "0.22.0"
anyhow = "1.0.86"
bytemuck = "1"
collections = { package = "gpui_ce_collections", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b" }
image = { version = "0.25.1", default-features = false, features = ["gif", "webp"] }
futures = "0.3.32"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b", default-features = false }
gpui_util = { package = "gpui_ce_util", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b" }
gpui_parley = { package = "gpui_ce_parley", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b", default-features = false, features = ["system-fonts"] }
gpui_wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b", optional = true }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
strum = { version = "0.27.2", features = ["derive"] }
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

# Always used
oo7 = { version = "0.6", default-features = false, features = [
  "async-std",
  "native_crypto",
] }
calloop = "0.14.3"
notify-rust = "4"
raw-window-handle = "0.6"

# Used in both windowing options
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification", "open_uri", "file_chooser", "settings", "trash"], optional = true }
bitflags = { version = "2.6.0", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8.0", default-features = false, optional = true }

# Screen capture

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
memfd = { version = "0.6.5", optional = true }
wayland-backend = { version = "0.3.15", features = [
  "client_system",
  "dlopen",
  "log",
], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = [
  "client",
  "staging",
  "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = [
  "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
  "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
  "allow-unsafe-code",
  "xkb",
  "randr",
  "xinput",
  "cursor",
  "resource_manager",
  "sync",
  "dri3",
], optional = true }
xim = { version = "0.4.0-zed", package = "zed-xim", features = [
  "x11rb-xcb",
  "x11rb-client",
], optional = true }
x11-clipboard = { version = "0.9.3", optional = true }

[package.metadata.cargo-shear]
ignored = ["bitflags", "scap", "x11-clipboard"]
