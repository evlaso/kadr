name: Idea
description: Something kadr could do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you're trying to do, and how kadr could help with it.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: A workaround, or another app that does it.
