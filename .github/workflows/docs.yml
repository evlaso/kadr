name: docs

# The site on GitHub Pages (the manual in two languages, its first page
# the home; scripts/manual.sh: Eleventy and Pagefind): built on every push
# to main that touches it, and pushed to the gh-pages branch whole, with
# releases/ carried over from what's there: the release job keeps
# latest.json in it, which the tray's update check reads.
on:
  push:
    branches: [main]
    paths:
      - docs/manual/**
      - docs/site/**
      - docs/images/**
      - scripts/manual.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: scripts/manual.sh
      - name: releases/ from gh-pages
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git archive FETCH_HEAD releases | tar x -C target/site || true
          fi
          touch target/site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site
          commit_message: "docs: site from"
