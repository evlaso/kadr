name: docs

# The site on GitHub Pages (the manual in two languages, its first page
# the home; scripts/manual.sh: Eleventy and Pagefind): built on every push
# to main that touches it, and put on the gh-pages branch in place of
# everything there but releases/: the release job keeps latest.json in it,
# which the tray's update check reads.
on:
  push:
    branches: [main]
    paths:
      - docs/manual/**
      - docs/site/**
      - docs/images/**
      - scripts/manual.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

# One docs run at a time, and one in the middle of a push isn't cancelled.
# The release job writes to gh-pages too (releases/latest.json only): each
# of the two starts from the branch as it is, never pushes by force, and
# does its push again on top of the other's if it lost the race.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: scripts/manual.sh
      - name: Publish to gh-pages
        # The branch as it is now, with everything but releases/ replaced by
        # the build: releases/latest.json is never read here, only left
        # where it is. Any failure stops the job before a push.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -e target/site/releases
          for attempt in 1 2 3; do
            rc=0
            git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
            if [ "$rc" = 0 ]; then
              git fetch --depth 1 origin gh-pages
              git worktree add --detach pages FETCH_HEAD
            elif [ "$rc" = 2 ]; then
              git worktree add --orphan -b gh-pages-new pages
            else
              exit 1
            fi
            find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name releases -exec rm -rf {} +
            cp -r target/site/. pages/
            touch pages/.nojekyll
            git -C pages add -A
            if git -C pages diff --cached --quiet; then
              echo "nothing changed"
              exit 0
            fi
            git -C pages commit -q -m "docs: site from $GITHUB_SHA"
            if git -C pages push origin HEAD:gh-pages; then
              exit 0
            fi
            # Someone pushed in between: start again from the new branch.
            git worktree remove --force pages
            git branch -D gh-pages-new 2>/dev/null || true
          done
          exit 1
