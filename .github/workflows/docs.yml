name: docs

# The site on GitHub Pages (the landing page and the manual in two
# languages, scripts/manual.sh): built on every push to main that touches
# it, and pushed to the gh-pages branch next to releases/latest.json, which
# the release job keeps there and the tray's update check reads.
on:
  push:
    branches: [main]
    paths:
      - docs/manual/**
      - docs/site/**
      - docs/images/**
      - scripts/manual.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/manual.sh
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site
          # releases/latest.json and anything else the release job keeps.
          keep_files: true
          commit_message: "docs: site from"
