name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes older builds of the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kadr-linux-x86_64
            binary: kadr
          - os: macos-latest
            artifact: kadr-macos-arm64
            binary: kadr
          - os: windows-latest
            artifact: kadr-windows-x86_64
            binary: kadr.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev \
            libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libfontconfig-dev
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
