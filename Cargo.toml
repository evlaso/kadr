[workspace]
members = ["crates/*"]

# Shared versions, so every crate builds against the same ones.
# The same for every crate (vendor/gpui_linux keeps GPUI CE's own, Apache-2.0).
[workspace.package]
version = "0.3.0-alpha.1"
license = "MIT"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "pnm"] }
serde_json = "1"
tiny-skia = "0.12.0"
resvg = { version = "0.48", default-features = false }
ab_glyph = "0.2.32"

[package]
name = "kadr"
version.workspace = true
edition = "2024"
license.workspace = true

[features]
dev = ["kadr-ui-gpui/dev"]

[dependencies]
kadr-core = { path = "crates/kadr-core" }
kadr-platform = { path = "crates/kadr-platform" }
kadr-tray = { path = "crates/kadr-tray" }
kadr-ui-gpui = { path = "crates/kadr-ui-gpui" }
serde_json.workspace = true

# `kadr overlay`: the area overlay as kadr itself, for a portable kadr
# that's one file (Linux has it as a thread of kadr).
[target.'cfg(not(target_os = "linux"))'.dependencies]
kadr-overlay = { path = "crates/kadr-overlay" }

# kadr.exe's icon and version (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
# The e2e tests compare what kadr saved with what the rasteriser draws.
image.workspace = true
kadr-raster = { path = "crates/kadr-raster" }


# For working on kadr and its tests: optimised, incremental, no
# whole-program pass, so a one-file change builds in seconds.
[profile.release]
strip = true
panic = "abort"
incremental = true

# What's shipped: `cargo build --profile dist` → target/dist/kadr. Smaller
# and a little faster: whole-program optimisation in one unit, ~2.5 min.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Smaller where speed doesn't matter: the D-Bus stack (the tray, the portal,
# notifications), accessibility, regex, the decoders of formats kadr only
# meets in wallpapers (GIF, WebP), SVG parsing (icons, once) and the shader
# translator (once at start), X11's protocol code (best effort, idle on
# Wayland), JSON (settings and logs) and dates. The renderer, PNG, JPEG (the studio's scrub
# frames) and the rasteriser keep full optimisation.
[profile.release.package.zbus]
opt-level = "s"
[profile.release.package.zvariant]
opt-level = "s"
[profile.release.package.zbus_names]
opt-level = "s"
[profile.release.package.ksni]
opt-level = "s"
[profile.release.package.accesskit]
opt-level = "s"
[profile.release.package.accesskit_unix]
opt-level = "s"
[profile.release.package.accesskit_atspi_common]
opt-level = "s"
[profile.release.package.atspi]
opt-level = "s"
[profile.release.package.atspi-common]
opt-level = "s"
[profile.release.package.atspi-proxies]
opt-level = "s"
[profile.release.package.ashpd]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.notify-rust]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.aho-corasick]
opt-level = "s"
[profile.release.package.x11rb]
opt-level = "s"
[profile.release.package.x11rb-protocol]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"

# GPUI CE's Linux platform with drawing tablet support (see vendor/README.md).
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui_ce_linux = { path = "vendor/gpui_linux" }
