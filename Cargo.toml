[package]
name = "kadr"
version = "0.2.0"
edition = "2024"

[dependencies]
# GPUI Community Edition, pinned; updated on purpose, not automatically.
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b", default-features = false, features = ["font-kit", "wayland", "image-default-formats"] }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "d52f747a7c4dd15fc0398047a491b7e5a49e578b", features = ["wayland"] }
smallvec = { version = "1", features = ["union"] }
palette = "0.7"
async-process = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
libc = "0.2"
serde_json = "1"
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "pnm"] }
tiny-skia = "0.12.0"
resvg = { version = "0.48", default-features = false }
ab_glyph = "0.2.32"
crc32fast = "1.5"

# The tray icon speaks StatusNotifierItem over D-Bus (Linux only for now).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# macOS and Windows share one implementation of the clipboard, notifications,
# the trash, monitors and screenshots (platform/desktop.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.7.0"
global-hotkey = "0.9.0"
notify-rust = "4.18.2"
trash = "5.2.9"
tray-icon = "0.26.1"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
# Smaller and a little faster: whole-program optimisation, one unit, no
# unwinding tables. Tests still unwind (cargo uses the test profile's own).
lto = "fat"
codegen-units = 1
panic = "abort"

# For working on kadr: release speed without the whole-program pass, which
# takes an incremental build from ~11 s to ~2.5 min. `cargo build --profile
# fast` → target/fast/kadr; `just` runs the tests with it.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"

# GPUI CE's Linux platform with drawing tablet support (see vendor/README.md).
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui_ce_linux = { path = "vendor/gpui_linux" }
