[package]
name = "kadr-platform"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Everything that differs between operating systems, without a UI framework"
publish = false

[dependencies]
kadr-core = { path = "../kadr-core" }
image.workspace = true
serde_json.workspace = true
libc = "0.2"
# The system's own open, save and folder dialogs (SPEC 3.10): the portal on
# Linux, NSOpenPanel on macOS, the common dialogs on Windows.
rfd = "0.17.2"
raw-window-handle = "0.6"

# macOS and Windows share one implementation of the clipboard, notifications,
# the trash, monitors and screenshots (desktop.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.7.0"
notify-rust = "4.18.2"
trash = "5.2.9"
xcap = "0.9.8"

# The system's pop-up menus (menu.rs); Linux has none outside GTK.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
# The system's cursors, for the studio and the editor's stamps.
objc2-app-kit = { version = "0.3.2", features = ["NSCursor", "NSImage", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
