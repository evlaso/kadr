[package]
name = "kadr-platform"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Everything that differs between operating systems, without a UI framework"
publish = false

[dependencies]
kadr-core = { path = "../kadr-core" }
image.workspace = true
serde_json.workspace = true
libc = "0.2"
# The system's own open, save and folder dialogs (SPEC 3.10): the portal on
# Linux, NSOpenPanel on macOS, the common dialogs on Windows.
rfd = "0.17.2"
raw-window-handle = "0.6"

# A window by itself on Wayland (toplevel.rs): the standard capture protocols.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# macOS and Windows share one implementation of the clipboard, notifications,
# the trash, monitors and screenshots (desktop.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.7.0"
notify-rust = "4.18.2"
trash = "5.2.9"
xcap = "0.9.8"

# The system's pop-up menus (menu.rs); Linux has none outside GTK.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
# The system's cursors, for the studio and the editor's stamps.
objc2-app-kit = { version = "0.3.2", features = ["NSCursor", "NSImage", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSObject"] }
# Recording (record/sck.rs): ScreenCaptureKit's stream into an AVAssetWriter.
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-media = { version = "0.3.2", features = ["CMBase", "CMSampleBuffer", "CMTime"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "SCShareableContent", "SCStream"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
    # Recording (record/wgc.rs): Windows.Graphics.Capture, Direct3D 11,
    # Media Foundation's sink writer and WASAPI.
    "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security",
    # Where a crash happened (crash_log).
    "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader",
] }
