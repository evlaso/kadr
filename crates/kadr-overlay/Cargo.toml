[package]
name = "kadr-overlay"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Picking an area of the screen: the model now, its own windows (layer-shell, winit) next"
publish = false

[[bin]]
name = "kadr-overlay"
path = "src/main.rs"

[dependencies]
kadr-core = { path = "../kadr-core" }
kadr-raster = { path = "../kadr-raster" }
image.workspace = true
tiny-skia.workspace = true
serde_json.workspace = true

# The overlay's own window on Wayland: a layer-shell surface drawn on the CPU.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"

# macOS and Windows: a borderless window above everything, drawn through
# softbuffer, in the kadr-overlay program.
[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = "0.30.12"
softbuffer = "0.4.8"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSResponder"] }
# The warm overlay's own picture of the screen (sck.rs).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-graphics", "objc2-core-foundation", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
